<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background rounded square -->
  <rect width="200" height="200" rx="40" fill="url(#gradient1)"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Database icon (right side) -->
  <g transform="translate(120, 80)">
    <!-- Database cylinder layers -->
    <ellipse cx="20" cy="10" rx="25" ry="8" fill="#ffffff" opacity="0.9"/>
    <rect x="-5" y="10" width="50" height="30" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="20" cy="40" rx="25" ry="8" fill="#ffffff" opacity="0.9"/>
    
    <!-- Database lines -->
    <line x1="-5" y1="10" x2="-5" y2="40" stroke="#2563eb" stroke-width="3"/>
    <line x1="45" y1="10" x2="45" y2="40" stroke="#2563eb" stroke-width="3"/>
    <ellipse cx="20" cy="10" rx="25" ry="8" fill="none" stroke="#2563eb" stroke-width="3"/>
    <ellipse cx="20" cy="25" rx="25" ry="8" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.5"/>
    <ellipse cx="20" cy="40" rx="25" ry="8" fill="none" stroke="#2563eb" stroke-width="3"/>
  </g>
  
  <!-- Neural network / AI brain (left side) -->
  <g transform="translate(35, 70)">
    <!-- Arc representing brain hemisphere -->
    <path d="M 0 30 Q 0 0, 30 0 Q 50 0, 50 30 Q 50 60, 30 60 Q 0 60, 0 30" 
          fill="#ffffff" opacity="0.9" stroke="#2563eb" stroke-width="3"/>
    
    <!-- Neural nodes -->
    <circle cx="12" cy="20" r="5" fill="#0ea5e9"/>
    <circle cx="25" cy="10" r="5" fill="#0ea5e9"/>
    <circle cx="38" cy="20" r="5" fill="#0ea5e9"/>
    <circle cx="12" cy="40" r="5" fill="#0ea5e9"/>
    <circle cx="25" cy="50" r="5" fill="#0ea5e9"/>
    <circle cx="38" cy="40" r="5" fill="#0ea5e9"/>
    
    <!-- Neural connections -->
    <line x1="12" y1="20" x2="25" y2="10" stroke="#60a5fa" stroke-width="2"/>
    <line x1="25" y1="10" x2="38" y2="20" stroke="#60a5fa" stroke-width="2"/>
    <line x1="12" y1="40" x2="25" y2="50" stroke="#60a5fa" stroke-width="2"/>
    <line x1="25" y1="50" x2="38" y2="40" stroke="#60a5fa" stroke-width="2"/>
    <line x1="12" y1="20" x2="12" y2="40" stroke="#60a5fa" stroke-width="2"/>
    <line x1="38" y1="20" x2="38" y2="40" stroke="#60a5fa" stroke-width="2"/>
    <line x1="25" y1="10" x2="25" y2="50" stroke="#60a5fa" stroke-width="2"/>
  </g>
  
  <!-- Upward trend arrow connecting both -->
  <g transform="translate(80, 90)">
    <path d="M 0 30 L 30 10 L 30 20 L 50 5" 
          stroke="#ffffff" stroke-width="4" stroke-linecap="round" 
          stroke-linejoin="round" fill="none" opacity="0.9"/>
    <!-- Arrow head -->
    <polygon points="50,5 45,0 55,0" fill="#ffffff" opacity="0.9"/>
    <polygon points="50,5 45,10 55,10" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
